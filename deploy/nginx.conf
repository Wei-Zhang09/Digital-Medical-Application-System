# 慧医数字医疗应用系统 · Nginx 站点配置（版本库副本）
#
# 实际生效的是 .dev/nginx/nginx-1.20.1/conf/nginx.conf（Nginx 二进制不进仓库）。
# scripts/deploy.sh 会把这份配置拷过去，改配置请改这里再执行脚本。
#
# 职责只有两件：托管前端 dist（80 端口），把 /api/ 与 /image/ 反代到后端 8080。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 上传药品图片限制 1MB，这里放宽一点给 multipart 头留空间
    client_max_body_size 4m;

    server {
        listen       80;
        server_name  _;

        root   html/medical;
        index  index.html;

        # 后端接口
        # ^~ 很关键：前缀匹配后不再尝试下面的正则 location。
        # 少了它会踩坑——/api/xxx.png、/image/xxx.jpg 会被静态资源正则抢走，
        # Nginx 去 dist 目录找文件，结果 404（图片全裂、接口偶发 404）。
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 药品图片（后端 uploads 目录由 /image/** 提供）
        location ^~ /image/ {
            proxy_pass http://127.0.0.1:8080/image/;
            proxy_set_header Host $host;
        }

        # 前端是 hash 路由，正常不需要重写；保留兜底
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 前端静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}

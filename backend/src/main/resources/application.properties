# ===== 服务 =====
server.port=8080
server.tomcat.uri-encoding=UTF-8

# ===== 数据源 =====
# 本机用项目内 3307 实例（见 scripts/db.sh）；换到标准环境（MySQL 服务 3306）时把下面这行换成注释里的 3306 版本
# spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bin_text?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/bin_text?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Druid
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.qst.medical.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ===== PageHelper =====
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.page-size-zero=true

# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
# 图片落盘目录（相对 jar 工作目录），由 /image/** 对外提供
upload.path=uploads

# ===== Jackson =====
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

# ===== Springfox 2.9.2 在 Boot 2.5+ 必须用 ant 路径匹配 =====
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===== 日志 =====
logging.level.com.qst.medical=debug

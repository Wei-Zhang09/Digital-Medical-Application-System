# ===== 服务 =====
server.port=8080
server.tomcat.uri-encoding=UTF-8
# 表单/请求体统一按 UTF-8 解码（否则中文用户名登录会匹配不到）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== 数据源 =====
# 默认连本机 MySQL 服务（MySQL09）的 3306，库名 digital_medical_application_system。
# 用项目自带实例（scripts/db.sh，3307）时用环境变量 DB_PORT=3307 覆盖。
#
# 账号口令不要写在这个文件里（会被提交到仓库）：
#   本机真实口令放同目录的 application-local.properties（已在 .gitignore 里，不进仓库），
#   或者用环境变量 DB_USER / DB_PASS。
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/digital_medical_application_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:zw}
spring.datasource.password=${DB_PASS:mysql0409}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Druid
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.qst.medical.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ===== PageHelper =====
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.page-size-zero=true

# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
# 图片落盘目录（相对 jar 工作目录），由 /image/** 对外提供
upload.path=uploads

# ===== Jackson =====
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

# ===== Springfox 2.9.2 在 Boot 2.5+ 必须用 ant 路径匹配 =====
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===== 日志 =====
logging.level.com.qst.medical=debug
